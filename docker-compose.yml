services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lingo}
      POSTGRES_USER: ${POSTGRES_USER:-lingo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lingo_local}
    ports:
      - "5432:5432"
    volumes:
      - lingo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-lingo} -d ${POSTGRES_DB:-lingo}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lingo_postgres_data:
